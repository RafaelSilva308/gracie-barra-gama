name: media-pipeline
# Baixa mídias geradas no Higgsfield (listadas em assets/pipeline/manifest.json),
# extrai frames com ffmpeg e commita o resultado no branch atual.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['assets/pipeline/manifest.json', 'assets/pipeline/run.sh', '.github/workflows/media-pipeline.yml']

permissions:
  contents: write

concurrency:
  group: media-pipeline-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          ffmpeg -version | head -1 && jq --version
      - name: Process manifest
        run: bash assets/pipeline/run.sh
      - name: Commit results
        run: |
          git config user.name "media-pipeline"
          git config user.email "media-pipeline@users.noreply.github.com"
          git add -A assets/generated assets/frames assets/video assets/pipeline/state 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "chore(media): pipeline output [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
